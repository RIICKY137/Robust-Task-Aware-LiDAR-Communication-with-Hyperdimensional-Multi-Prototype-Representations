[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdc-task-aware-lidar"
version = "0.1.0"
description = "HDC-based task-aware LiDAR communication for bandwidth-constrained, noisy robotic systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Peichen Liu" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "streamlit>=1.36",
  "plotly>=5.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
torch = ["torch>=2.2"]

[project.scripts]
hdc-prepare-data = "scripts.prepare_data:main"
hdc-lab = "hdc_lidar.lab:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
